apiVersion: v1
kind: Pod
metadata:
  name: restricted-pod
  namespace: default
spec:
  containers:
    - name: app
      image: alpine:3.20
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
