apiVersion: v1
kind: Namespace
metadata:
  name: tenant-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: tenant-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: tenant-1
spec:
  selector:
    app: nginx
  ports:
    - port: 8080
      targetPort: 80
